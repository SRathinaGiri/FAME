name: Android App

on:
  push:
    branches: [native-apps, main]
    paths-ignore: ['**.md', 'desktop/**', '.github/workflows/windows-app.yml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK / AAB as a GitHub release

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-24.04 ships the Android SDK (ANDROID_HOME).
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Require the permanent signing key
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (and ANDROID_KEY_ALIAS if the alias is not 'fame') under Settings → Secrets and variables → Actions. Every APK must be signed with the same key, or Android refuses to update the app without uninstalling it (which deletes its data)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop --ignore-scripts

      - name: Test encrypted database engine and Android bridge path
        run: npm run test:native

      - name: Copy web app into the Android project
        run: npm run build:android

      - name: Read version
        run: |
          N=$(grep -oP "APP_VERSION = 'v\K[0-9]+" src/app.js)
          test -n "$N"
          echo "APP_VERSION=0.${N}.0" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build signed APK and App Bundle (.aab for Google Play)
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="${KEY_ALIAS:-fame}"
          export ANDROID_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease -PappVersionCode="$VERSION_CODE" -PappVersionName="$APP_VERSION"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          grep -q "SHA-256 digest" signature.txt
          OUT="FAME-v${APP_VERSION}-build${VERSION_CODE}.apk"
          cp "$APK" "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -certs "$AAB" | tee aab-signature.txt
          grep -q "jar verified" aab-signature.txt
          AAB_OUT="FAME-v${APP_VERSION}-build${VERSION_CODE}.aab"
          cp "$AAB" "$AAB_OUT"
          echo "AAB_FILE=$AAB_OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: |
            ${{ env.APK_FILE }}
            ${{ env.AAB_FILE }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main = the official release; other branches publish test builds as pre-releases
          if [ "$GITHUB_REF_NAME" = "main" ]; then RELEASE_KIND="--latest"; else RELEASE_KIND="--prerelease"; fi
          gh release create "android-v${APP_VERSION}-build${VERSION_CODE}" "$APK_FILE" "$AAB_FILE" \
            --target "$GITHUB_SHA" $RELEASE_KIND \
            --title "F.A.M.E ${APP_VERSION} for Android (build ${VERSION_CODE})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Phone: install the .apk over the previous build; your data is kept. Google Play: upload the .aab (versionCode ${VERSION_CODE})."

      - name: Keep only the newest android release (main only)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("android-"))] | sort_by(.createdAt) | reverse | .[1:][] | .tagName' |
          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
